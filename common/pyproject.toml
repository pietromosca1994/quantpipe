[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantpipe-common"
version = "0.1.0"
description = "Shared config, schemas, and DB access for QuantPipe services"
requires-python = ">=3.12"
dependencies = [
    "pydantic~=2.9",
    "pydantic-settings~=2.5",
    "PyYAML~=6.0",
    "SQLAlchemy~=2.0",
    "alembic~=1.13",
    "psycopg[binary]~=3.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["quantpipe_common*"]
