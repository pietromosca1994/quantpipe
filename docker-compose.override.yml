# Local development convenience only: exposes internal service UIs/ports on
# the host so you can poke at them directly. Never applies to the VM deployment
# — infra/terraform's security list only opens SSH and Grafana's port.
services:
  timescaledb:
    ports:
      - "5432:5432"

  prefect-server:
    ports:
      - "4200:4200"
    environment:
      # PREFECT_SERVER_API_HOST=0.0.0.0 (base compose file) is a bind address, not
      # something a browser can connect to — the UI's JS reads PREFECT_UI_API_URL
      # separately to know where to send API calls from the host browser.
      PREFECT_UI_API_URL: http://127.0.0.1:4200/api

  mlflow:
    ports:
      - "5000:5000"

  prometheus:
    ports:
      - "9090:9090"

  ingestion-flows:
    ports:
      - "8000:8000"
