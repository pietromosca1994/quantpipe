apiVersion: 1

datasources:
  - name: Prometheus
    uid: Prometheus # dashboard JSON panels reference this UID directly — keep in sync
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: TimescaleDB
    uid: TimescaleDB # dashboard JSON panels reference this UID directly — keep in sync
    type: postgres
    access: proxy
    url: timescaledb:5432
    database: "${POSTGRES_DB}"
    user: "${POSTGRES_USER}"
    secureJsonData:
      password: "${POSTGRES_PASSWORD}"
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
