[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = [
    "common/tests",
    "services/ingestion/tests",
    "experiments/tests",
]
pythonpath = [
    "common",
    "services/ingestion/src",
    "experiments",
]
# common/tests, services/ingestion/tests, and experiments/tests all package as
# "tests" — importlib mode resolves each by file path instead of colliding on
# that shared name.
addopts = "--import-mode=importlib"
